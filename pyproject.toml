[project]
name = "weekendplanner"
version = "0.1.0"
license = "MIT"
description = "Ranks weekend-trip destinations by flights, price, quality, activities and originality."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "typer>=0.15",
]

[project.scripts]
weekend = "app.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[dependency-groups]
dev = [
    "diff-cover>=9",
    "httpx>=0.27",
    "pip-audit>=2.7",
    "pre-commit>=4",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-socket>=0.7",
    "ruff>=0.8",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C90", "T20", "ERA", "BLE", "PT", "SIM", "RUF"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--allow-hosts=127.0.0.1,::1 --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["app"]
